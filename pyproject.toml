[project]
name = "ai-code-assistant"
version = "0.1.0"
description = "Agentic RAG assistant that answers AI and software-development questions from arXiv papers, with web-search fallback"
readme = "README.md"
authors = [
    { name = "Francisco Javier Gomez Sanchez", email = "gomez.sanchez.francisco@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "langchain>=1.4",
    "langchain-openai>=1.6",
    "langchain-tavily>=0.2",
    "langgraph>=1.2",
    "openai>=1.40",
    "pinecone>=5.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.60",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
