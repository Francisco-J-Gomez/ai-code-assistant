name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests (mocked, no network)
        run: uv run pytest -q

      - name: Run arXiv integration tests (real API, no secrets needed)
        env:
          RUN_ARXIV_INTEGRATION_TESTS: "1"
        run: uv run pytest tests/test_arxiv_integration.py -v
